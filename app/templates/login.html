{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto;">
  <h1>ログイン</h1>
  <form method="post" action="/login">
    <div class="formrow"><input type="password" name="token" placeholder="API トークン" style="flex:1" autofocus></div>
    <div class="formrow"><button class="primary" style="width:100%">入る</button></div>
  </form>
  <p class="muted">トークンはサーバの <code>/projects/health-hub/.env</code> の API_TOKEN</p>
</div>
{% endblock %}
